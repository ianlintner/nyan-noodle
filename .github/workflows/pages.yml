name: Deploy to GitHub Pages

# Publishes the game at https://ianlintner.github.io/nyan-noodle/ alongside
# the Azure Static Web Apps deployment in azure-static-web-apps.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Build artifacts are untrusted input to deployment: the build job gets only
# contents: read, and the Pages/OIDC permissions live on the deploy job alone.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Full gate: typecheck, lint, format, unit tests, asset validation and
      # a default-base build. Runs before the Pages-specific rebuild below.
      - run: npm run check
      - name: Build for Pages subpath
        run: npm run build
        env:
          VITE_BASE: /nyan-noodle/
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/game/dist

  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
